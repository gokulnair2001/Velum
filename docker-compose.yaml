services:
  # ── Velum API server ──────────────────────────────────
  velum:
    build: .
    container_name: velum
    expose:
      - "8080"
    env_file: .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - velum-network

networks:
  velum-network:
    external: true